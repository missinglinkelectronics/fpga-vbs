variables:
  XILINX_LOCAL_USER_DATA: "no"
  LOG_PARSER_SCRIPT: "tests/scripts/vivado_log_parser.py"

stages:
  - test

test_axi4-dummy-master_packaging:
  stage: test
  timeout: 5m
  parallel:
    matrix:
      - ENV_SCRIPT: vitis-v2020.2.sh
      - ENV_SCRIPT: vitis-v2021.2.sh
      - ENV_SCRIPT: vitis-v2025.2.sh
      - ENV_SCRIPT: vitis-v2026.1.sh
  artifacts:
    when: always
    reports:
      codequality: issue_report.json
    paths:
      - tests/axi4-dummy-master/build/**/*.log
      - issue_report.json
    expire_in: 5 days
  script:
    - bash tests/scripts/test_axi4-dummy-master_packaging.sh

test_axi4-dummy-master_patch_level:
  stage: test
  timeout: 5m
  parallel:
    matrix:
      - ENV_SCRIPT: vitis-v2025.2-ksb1.sh
